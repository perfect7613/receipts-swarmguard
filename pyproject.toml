[project]
name = "receipts-swarmguard"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "neatlogs>=1.4.26",
    "openai>=3.29.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[project.scripts]
receipts = "receipts.cli:main"

[project.optional-dependencies]
cloud = [
    "modal==1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
